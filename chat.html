<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- <link rel="icon" href="public/chat_pat.jpg" type="image/jpeg"> -->


    <title>Chat-Pat</title>

    <style>
        body {
            margin: 0;
            background: #000000;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #fff;
        }

        .title {
            text-align: flex-start;
            padding-left: 21px;
            background: #2a2a2a;
            margin: 0;
            font-size: 17px;
        }

        /* Chat container */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Message bubbles */
        .msg {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 15px;
            word-wrap: break-word;
        }

        .me {
            align-self: flex-end;
            background: #4a90e2;
            color: #fff;
        }

        .other {
            align-self: flex-start;
            background: #3a3a3a;
            color: #fff;
        }

        /* .user {
            padding: 10px 14px;
            border-radius: 12px;
            align-self: flex-start;
            background: #3a3a3a;
            color: #fff;
        } */

        .system-connected {
            color: #4caf50;
            align-self: flex-end;
            font-size: 13px;
            opacity: 0.7;
        }

        .system-disconnected {
            color: #f44336;
            align-self: flex-end;
            font-size: 13px;
            opacity: 0.7;
        }

        /* Input bar */
        #input-bar {
            display: flex;
            padding: 54px;
            background: #2a2a2a;
            border-top: 1px solid #444;
        }

        #input-user {
            position: relative;
            display: inline-flex;
            padding-left: 54px;
            background: #2a2a2a;
            border-top: 1px solid #444;
            align-items: center;
        }

        #msg {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            background: #fff;
            color: #000;
        }

        #user-name {
            padding: 8px 12px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            background: #fff;
            color: #000;
        }

        .indicator {
            /* hidden by default */
            margin-left: 8px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: gray;
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            line-height: 24px;
            cursor: help;
            transition: background-color 0.2s;
        }

        .indicator:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            background: #333;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 14px;
            white-space: nowrap;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        #send {
            margin-left: 12px;
            padding: 14px 22px;
            border: none;
            border-radius: 10px;
            background: #4a90e2;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        #send:hover {
            background: #357ac8;
        }


        #send:hover {
            background: #357ac8;
        }
    </style>
</head>

<body>
    <div class="title">
        <h1>Chat-Pat</h1>
    </div>

    <div id="input-user">
        <input id="user-name" type="text" placeholder="Type your user-name…" />
        <span class="indicator" id="indicator" title="At least 3 characters">!</span>
    </div>


    <div id="input-bar">
        <input id="msg" placeholder="Type a message…" />
        <button id="send">Send</button>
    </div>

    <div id="chat"></div>

    <script>
        const WS_URL = "wss://websocket-server.pgdimitrov.workers.dev/websocket";


        const userNameInput = document.getElementById("user-name");
        // userNameInput.addEventListener("input", () => {
        //     const userName = userNameInput.value.trim();
        //     if (userName) {
        //         addMessage(`Hello, ${userName}! You can start chatting now.`, "system");
        //     }
        // });

        const chat = document.getElementById("chat");

        const msgInput = document.getElementById("msg");
        msgInput.disabled = true;

        const sendBtn = document.getElementById("send");
        sendBtn.disabled = true;

        userNameInput.addEventListener("input", () => {
            if (userNameInput.value.length > 2) {
                msgInput.disabled = false;

            }
            else {
                msgInput.disabled = true;
                sendBtn.disabled = true;
            }
        });

        msgInput.addEventListener("input", () => {
            if (msgInput.value.length > 0) {
                sendBtn.disabled = false;
            }
            else {
                sendBtn.disabled = true;
            }
        });

        sendBtn.addEventListener("click", () => {
            if (msgInput.value.length > 0) {
                sendBtn.disabled = true;
            }
        });




        function addMessage(text, cls = "system") {
            const div = document.createElement("div");
            div.textContent = text;
            div.className = "msg " + cls;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        let ws;

        function connect() {
            ("Connecting…", "system");

            ws = new WebSocket(WS_URL);

            ws.onopen = () => addMessage("Connected", "system-connected");


            ws.onmessage = (e) => {
                const t = e.data;
                console.log("Received:", t);
                if (t.includes("wrote")) addMessage(t, "me");
                else addMessage(t, "other");
            };

            ws.onclose = () => {
                addMessage("Disconnected — reconnecting…", "system-disconnected");
                setTimeout(connect, 2000);
            };
        }

        sendBtn.onclick = () => {
            if (ws.readyState === WebSocket.OPEN) {
                const msg = {
                    room: 'default', // optional, for room-based routing on server
                    username: userNameInput.value,          // optional, for routing on server
                    content: msgInput.value,
                    timestamp: Date.now(),
                    // add any other fields you need
                };
                ws.send(JSON.stringify(msg));
                msgInput.value = "";
            }
        };

        msgInput.onkeydown = (e) => {
            if (e.key === "Enter") sendBtn.onclick();
        };

        connect();
    </script>

</body>

</html>

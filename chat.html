<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/public/chat_mat.jpg" type="image/jpeg">


    <title>Chat-Mat</title>

    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #fff;
        }

        .title {
            text-align: flex-start;
            padding-left: 21px;
            background: #2a2a2a;
            margin: 0;
            font-size: 17px;
        }

        /* Chat container */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Message bubbles */
        .msg {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 15px;
            word-wrap: break-word;
        }

        .me {
            align-self: flex-end;
            background: #4a90e2;
            color: #fff;
        }

        .other {
            align-self: flex-start;
            background: #3a3a3a;
            color: #fff;
        }

        .user {
            padding: 10px 14px;
            border-radius: 12px;
            align-self: flex-start;
            background: #3a3a3a;
            color: #fff;
        }

        .system-connected {
            color: #4caf50;
            align-self: flex-end;
            font-size: 13px;
            opacity: 0.7;
        }

        .system-disconnected {
            color: #f44336;
            align-self: flex-end;
            font-size: 13px;
            opacity: 0.7;
        }

        /* Input bar */
        #input-bar {
            display: flex;
            padding: 54px;
            background: #2a2a2a;
            border-top: 1px solid #444;
        }

        #msg {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            background: #fff;
            color: #000;
        }

        #send {
            margin-left: 12px;
            padding: 14px 22px;
            border: none;
            border-radius: 10px;
            background: #4a90e2;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        #send:hover {
            background: #357ac8;
        }


        #send:hover {
            background: #357ac8;
        }
    </style>
</head>

<body>
    <div class="title">
        <h1>Chat-Mat</h1>
    </div>

    <!-- <div class="user">

    </div> -->

    <!-- <div> <input class="user" type="text" id="user-name" placeholder="Type your name…" />
    </div> -->


    <div id="input-bar">
        <input id="msg" placeholder="Type a message…" />
        <button id="send">Send</button>
    </div>

    <div id="chat"></div>

    <script>
        const WS_URL = "wss://websocket-server.pgdimitrov.workers.dev/websocket";


        const userNameInput = document.getElementById("user-name");
        // userNameInput.addEventListener("input", () => {
        //     const userName = userNameInput.value.trim();
        //     if (userName) {
        //         addMessage(`Hello, ${userName}! You can start chatting now.`, "system");
        //     }
        // });

        const chat = document.getElementById("chat");
        const msgInput = document.getElementById("msg");
        const sendBtn = document.getElementById("send");

        function addMessage(text, cls = "system") {
            const div = document.createElement("div");
            div.textContent = text;
            div.className = "msg " + cls;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        let ws;

        function connect() {
            ("Connecting…", "system");

            ws = new WebSocket(WS_URL);

            ws.onopen = () => addMessage("Connected", "system-connected");


            ws.onmessage = (e) => {
                const t = e.data;
                console.log("Received:", t);
                if (t.includes("Wrote")) addMessage(t, "me");
                else addMessage(t, "other");
            };

            ws.onclose = () => {
                addMessage("Disconnected — reconnecting…", "system-disconnected");
                setTimeout(connect, 2000);
            };
        }

        sendBtn.onclick = () => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(msgInput.value);
                msgInput.value = "";
            }
        };

        msgInput.onkeydown = (e) => {
            if (e.key === "Enter") sendBtn.onclick();
        };

        connect();
    </script>

</body>

</html>

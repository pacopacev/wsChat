<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chat-Mat</title>

    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #fff;
        }

        /* Chat container */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Message bubbles */
        .msg {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 15px;
            word-wrap: break-word;
        }

        .me {
            align-self: flex-end;
            background: #4a90e2;
            color: #fff;
        }

        .other {
            align-self: flex-start;
            background: #3a3a3a;
            color: #fff;
        }

        .system {
            align-self: center;
            font-size: 13px;
            opacity: 0.7;
        }

        /* Input bar */
        #input-bar {
            display: flex;
            padding: 54px;
            background: #2a2a2a;
            border-top: 1px solid #444;
        }

        #msg {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            background: #fff;
            color: #000;
        }

        #send {
            margin-left: 12px;
            padding: 14px 22px;
            border: none;
            border-radius: 10px;
            background: #4a90e2;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        #send:hover {
            background: #357ac8;
        }


        #send:hover {
            background: #357ac8;
        }
    </style>
</head>

<body>



    <div id="input-bar">
        <input id="msg" placeholder="Type a message…" />
        <button id="send">Send</button>
    </div>

    <div id="chat"></div>

    <script>
        const WS_URL = "wss://websocket-server.pgdimitrov.workers.dev/websocket";

        const chat = document.getElementById("chat");
        const msgInput = document.getElementById("msg");
        const sendBtn = document.getElementById("send");

        function addMessage(text, cls = "system") {
            const div = document.createElement("div");
            div.textContent = text;
            div.className = "msg " + cls;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        let ws;

        function connect() {
            addMessage("Connecting…", "system");

            ws = new WebSocket(WS_URL);

            ws.onopen = () => addMessage("Connected", "system");

            ws.onmessage = (e) => {
                const t = e.data;
                if (t.includes("Echo")) addMessage(t, "me");
                else addMessage(t, "other");
            };

            ws.onclose = () => {
                addMessage("Disconnected — reconnecting…", "system");
                setTimeout(connect, 2000);
            };
        }

        sendBtn.onclick = () => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(msgInput.value);
                msgInput.value = "";
            }
        };

        msgInput.onkeydown = (e) => {
            if (e.key === "Enter") sendBtn.onclick();
        };

        connect();
    </script>

</body>

</html>
